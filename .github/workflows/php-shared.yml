name: PHP Shared Hosting Checks
on:
  push:
    branches: ["deploy/hostinger-php-mysql"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Check PHP syntax
        run: |
          php -l api/index.php
          php -l api/config.example.php
          php -l hostinger-shared/api/index.php
          php -l hostinger-shared/api/config.example.php
